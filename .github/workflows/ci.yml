name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Add targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Clippy (aarch64)
        run: cargo clippy --target aarch64-apple-darwin -- -D warnings

      - name: Clippy (x86_64)
        run: cargo clippy --target x86_64-apple-darwin -- -D warnings

      - name: Test
        run: cargo test

  build-aarch64:
    name: Build (aarch64)
    runs-on: macos-latest
    needs: check
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/aarch64-apple-darwin
          key: ${{ runner.os }}-cargo-aarch64-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (aarch64)
        run: mise run build -- aarch64-apple-darwin

  build-x86_64:
    name: Build (x86_64)
    runs-on: macos-latest
    needs: check
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/x86_64-apple-darwin
          key: ${{ runner.os }}-cargo-x86_64-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (x86_64)
        run: mise run build -- x86_64-apple-darwin
