[tasks."build:both"]
description = "Build ledctl for both targets"
run = """
mise run build -- aarch64-apple-darwin
mise run build -- x86_64-apple-darwin
"""

[tasks.build]
description = "Build ledctl for a target"
usage = 'arg "<target>" help="Target triple to build for"'
run = """
rustup target add "${usage_target?}"
cargo build --release --target "${usage_target?}"
"""

[tasks.lipo]
description = "Combine aarch64 and x86_64 release binaries into target/ledctl"
run = """
lipo -create \
    -output target/ledctl \
    target/aarch64-apple-darwin/release/ledctl \
    target/x86_64-apple-darwin/release/ledctl
echo "Universal binary at target/ledctl"
lipo -info target/ledctl
"""

[tasks.clean]
description = "Remove build artifacts"
run = """
cargo clean
rm -f target/ledctl
"""
