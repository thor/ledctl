[tasks.build]
description = "Build ledctl for a target (usage: mise run build -- aarch64-apple-darwin)"
run = """
TARGET="${1:?usage: mise run build -- <target>}"
rustup target add "$TARGET"
cargo build --release --target "$TARGET"
"""

[tasks.lipo]
description = "Combine aarch64 and x86_64 release binaries into target/ledctl"
run = """
lipo -create \
    -output target/ledctl \
    target/aarch64-apple-darwin/release/ledctl \
    target/x86_64-apple-darwin/release/ledctl
echo "Universal binary at target/ledctl"
lipo -info target/ledctl
"""

[tasks.clean]
description = "Remove build artifacts"
run = """
cargo clean
rm -f target/ledctl
"""
